global:
  scrape_interval: 10s
  evaluation_interval: 10s

# The service plus the observability stack itself, so a broken pipeline
# (dropped spans, rejected logs) is visible too.
scrape_configs:
  - job_name: companies-service
    static_configs:
      - targets: ["api:8080"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
