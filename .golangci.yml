version: "2"

run:
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - copyloopvar
    - dupl
    - dupword
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - funlen
    - gocritic
    - goconst
    - gocyclo
    - gosec
    - intrange
    - loggercheck
    - misspell
    - modernize
    - nestif
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - predeclared
    - reassign
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - testifylint
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - whitespace
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags: [diagnostic, performance, style]
      disabled-checks:
        - hugeParam
        - unnamedResult
    nolintlint:
      require-explanation: true
      require-specific: true
    funlen:
      lines: 80
      statements: 50
    gocyclo:
      min-complexity: 15
    loggercheck:
      slog: true
      zap: false
      require-string-key: true
    sloglint:
      attr-only: true
      context: scope
      static-msg: true
      key-naming-case: snake
      forbidden-keys: [time, level, msg, source]
    revive:
      enable-default-rules: true
      rules:
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T"
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: unused-parameter
          disabled: true
  exclusions:
    generated: strict
    paths:
      - internal/mocks
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, perfsprint, unparam, errname, gocritic, funlen, dupl, goconst]

formatters:
  enable:
    - gofumpt
    - goimports
    - golines
  settings:
    golines:
      max-len: 120
    goimports:
      local-prefixes:
        - example.com/companies
